# Include inside the existing gacrac.gagis.cn server block.
# Extract the package's ga-application directory under /var/www/gaalop-sites/.
location = /ga-application/gaalop { return 301 /ga-application/gaalop/$is_args$args; }
location = /ga-application/quantumgaalop { return 301 /ga-application/quantumgaalop/$is_args$args; }

# Standalone Spring Boot backend with server.servlet.context-path=/gaalop.
location ^~ /ga-application/gaalop/api/ {
    proxy_pass http://127.0.0.1:18080/gaalop/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
}
location ^~ /ga-application/quantumgaalop/api/ {
    proxy_pass http://127.0.0.1:18080/gaalop/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
}
location /ga-application/gaalop/ {
    root /var/www/gaalop-sites;
    index index.html;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
}
location /ga-application/quantumgaalop/ {
    root /var/www/gaalop-sites;
    index index.html;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
}
