# Include inside the existing domain's server block.
location = /gaalop {
    return 301 /gaalop/;
}

location ^~ /gaalop/api/ {
    # No URI suffix: preserve /gaalop/api/... for the Java service.
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin "";
}

location = /gaalop/swagger-ui.html {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $http_host;
}

location ^~ /gaalop/swagger-ui/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $http_host;
}

location ^~ /gaalop/v3/api-docs/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $http_host;
}

location ^~ /gaalop/ {
    alias /var/www/gaalop/;
    index index.html;

    # Compress only GAALOP static resources; no optional Nginx modules needed.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Revalidate HTML and non-fingerprinted files such as ganja.js.
    expires -1;

    # Vite filenames contain content hashes, so these files can be cached safely.
    location ^~ /gaalop/assets/ {
        alias /var/www/gaalop/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
