server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name gacrac.gagis.cn;

    # GACRAC main website: http://gacrac.gagis.cn/
    root /var/www/html;
    index index.html index.htm index.nginx-debian.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Always keep the trailing slash because the GAALOP build uses relative URLs.
    location = /ga-application/gaalop {
        return 301 /ga-application/gaalop/;
    }

    # Public request:
    # /ga-application/gaalop/api/v1/compile
    # Backend request:
    # /gaalop/api/v1/compile
    location ^~ /ga-application/gaalop/api/ {
        proxy_pass http://127.0.0.1:8080/gaalop/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
    }

    # Vite filenames contain content hashes and can be cached permanently.
    location ^~ /ga-application/gaalop/assets/ {
        alias /var/www/gaalop/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # GAALOP static website: /var/www/gaalop/index.html
    location ^~ /ga-application/gaalop/ {
        alias /var/www/gaalop/;
        index index.html;
        expires -1;
    }
}
