server.port=8080
server.servlet.context-path=/gaalop
logging.file.path=${gaalop.app.home}/logs
spring.jackson.mapper.accept-case-insensitive-enums=true
gaalop.swagger.username=${GAALOP_SWAGGER_USERNAME:GACRAC}
gaalop.swagger.password=${GAALOP_SWAGGER_PASSWORD:GAGIS}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.groups.enabled=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.config-url=${server.servlet.context-path}/v3/api-docs/swagger-config
springdoc.swagger-ui.urls-primary-name=English
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# Optional. Relative paths are resolved from the process working directory.
# Example for a project-local Maxima distribution:
# gaalop.maxima.command=tools/maxima/bin/maxima.bat
gaalop.maxima.command=

# Successful compile requests are appended as JSONL under:
# compile-history/yyyy-MM-dd/gaalop-success.jsonl
gaalop.compile-history.enabled=${GAALOP_COMPILE_HISTORY_ENABLED:false}
gaalop.compile-history.path=${gaalop.app.home}/compile-history

# Comma-separated browser origins. Same-origin Docker requests do not require CORS.
gaalop.cors.allowed-origin-patterns=${GAALOP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173}
